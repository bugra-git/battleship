<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>
  <body>
    <h1>Battleship</h1>
    <div class="game">
      <div>
        <h2 class="playerHeader">Drag and drop to move, click to rotate</h2>
        <div class="board player-board"></div>
      </div>
      <div>
        <h2 class="compHeader">Opponent's board</h2>
        <div class="board opponent-board"></div>
      </div>
      <div class="buttons">
        <button id="play">Play</button>
      </div>
    </div>
  </body>
</html>
